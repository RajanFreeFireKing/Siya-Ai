name: siya_ai
description: Siya Ai - voice assistant (Flutter UI + Kotlin logic)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.6      # wallpaper (video / live) ke liye
  flutter_map: ^6.1.0       # location map (OpenStreetMap, API key nahi chahiye)
  latlong2: ^0.9.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
