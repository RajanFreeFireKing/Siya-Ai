name: Build Siya AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter diagnostics
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart files
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        if: ${{ vars.ENABLE_APK_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Siya-Ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Explain skipped artifact upload
        if: ${{ vars.ENABLE_APK_ARTIFACTS != 'true' }}
        run: |
          echo "APK built successfully, but artifact upload is disabled because storage quota may be exhausted."
          echo "Set repository variable ENABLE_APK_ARTIFACTS=true after clearing Actions storage to enable artifact uploads."
