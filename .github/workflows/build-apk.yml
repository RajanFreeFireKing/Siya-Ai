name: Build Siya AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Runner startup trace
        shell: bash
        run: |
          set -euxo pipefail
          echo "runner startup trace: began"
          date -u
          uname -a
          id

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter diagnostics
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart files
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Verify APK exists
        run: |
          set -euxo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Siya-Ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
